<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        const name = "lantern"
        let votes = 17
        let famous = ""

        if (votes > 10) {
            famous = "famous"
        }
        else if (votes >= 0){
            famous = "normal"
        }
        else {
            famous = "negative"
        }
        console.log(`${name} have ${votes} votes and is ${famous}`)
    </script>
</body>

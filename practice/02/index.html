<body>
    <script>
        let total = 0
        for (let i = 1; i <= 10; i++) {
            console.log(i)
        }
        for (let i = 1; i <= 20; i++) {
            if (i % 2 === 0) {
                console.log(i)
            }
        }
        for (let i=1; i <=100; i++) {
            total += i
        }
        console.log(total)

        const themes = ["asian", "medieval", "cyberpunk", "space", "seasons"]
        for (const theme of themes) {
            console.log(theme)
        }
        for (let i=0; i < themes.length; i++) {
            console.log(`${i + 1} - ${themes[i]}`)
        }

    </script>

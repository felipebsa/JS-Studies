<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A3 · Decisions with if</title>
</head>

<body>

  <h1>A3 · Decisions with if</h1>

  <script>

    const grade = 5.5;

    if (grade >= 6) {

      console.log("Passed");

    } else if (grade >= 4 && grade < 6) {

      console.log("Recovery");

    } else {

      console.log("Failed");

    }

  </script>

</body>

</html>

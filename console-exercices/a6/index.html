<body>

  <h1>A6 · Lists (arrays)</h1>
  <script>

    const prices = [30, 80, 55, 120, 20];

    const expensive = prices.filter(p => p > 50);
    const discounted = expensive.map(p => p * 0.9);

    console.log(expensive.join(", "));
    console.log(discounted.join(", "));
    console.log(discounted.length);

  </script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A4 · Loops with for</title>
</head>
<body>

  <h1>A4 · Loops with for</h1>

  <script>

    let sum = 0;

    for (let i = 1; i <= 10; i++) {

      if (i % 2 === 0) {

        console.log(i + " is even");
        sum += i;
      }

    }

    console.log("Sum of evens: " + sum);

  </script>

</body>
</html>

<body>

  <h1>A2 · Types and conversion</h1>
  <script>

    const grade1 = "9";
    const grade2 = "6";

    const average = (Number(grade1) + Number(grade2)) / 2;

    console.log(`Average: ${average.toFixed(2)}`);

    const invalid = Number("abc");
    console.log(isNaN(invalid));

  </script>
